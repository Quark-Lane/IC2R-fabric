name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (must match an existing GitHub Release tag)"
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod JAR
        run: ./gradlew --no-daemon --stacktrace "-Pmod_version=${RELEASE_VERSION}" -Pfabric_version_suffix= build
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Verify the mod JAR matches the tag
        shell: bash
        run: |
          expected="build/libs/ic2-fabric-${RELEASE_VERSION}.jar"
          if [[ ! -f "$expected" ]]; then
            echo "Expected ${expected}, but build/libs contains:" >&2
            ls -1 build/libs >&2
            exit 1
          fi
          echo "Artifact ${expected} matches version ${RELEASE_VERSION}."
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Attest mod JAR
        uses: actions/attest@v4
        with:
          subject-path: build/libs/ic2-fabric-*.jar

      - name: Create JAR checksum
        shell: bash
        run: |
          cd build/libs
          sha256sum "ic2-fabric-${RELEASE_VERSION}.jar" > "ic2-fabric-${RELEASE_VERSION}.jar.sha256"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Add mod JAR and checksum to release
        shell: bash
        run: |
          gh release upload "${RELEASE_VERSION}" \
            "build/libs/ic2-fabric-${RELEASE_VERSION}.jar" \
            "build/libs/ic2-fabric-${RELEASE_VERSION}.jar.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
